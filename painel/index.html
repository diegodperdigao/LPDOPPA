<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Painel · Doppa</title>
<style>
  :root{
    --bg:#0b0b14; --panel:#14141f; --panel2:#1b1b2a;
    --bd:rgba(255,255,255,.08); --bd2:rgba(255,255,255,.14);
    --tx:#EAEDFB; --mut:#9AA2CC; --dim:#6B739E;
    --purple:#7B4DFF; --green:#22D46E; --blue:#2A52FF; --yellow:#FFD300; --red:#FF5C7A;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--tx);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding:0 0 60px}
  a{color:var(--purple)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:5;background:rgba(11,11,20,.82);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--bd);padding:14px 0}
  header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:18px;display:flex;align-items:center;gap:9px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--green));box-shadow:0 0 12px var(--purple)}
  .grow{flex:1 1 auto}
  .rangebtns{display:flex;gap:6px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:4px}
  .rangebtns button{background:transparent;border:0;color:var(--mut);padding:7px 12px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px}
  .rangebtns button.on{background:var(--purple);color:#fff}
  .ghost{background:var(--panel);border:1px solid var(--bd);color:var(--tx);padding:8px 12px;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px}
  .ghost:hover{border-color:var(--bd2)}
  .updated{font-size:12px;color:var(--dim)}

  h1{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:26px 0 12px;font-weight:700}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:16px;padding:16px 16px 14px}
  .card .lab{font-size:12.5px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:7px}
  .card .val{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1}
  .card .sub{font-size:12.5px;color:var(--dim);margin-top:6px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.g{background:rgba(34,212,110,.14);color:#5ff0a3}
  .pill.p{background:rgba(123,77,255,.16);color:#b79bff}
  .pill.y{background:rgba(255,211,0,.14);color:#ffe071}
  .pill.r{background:rgba(255,92,122,.16);color:#ff9db1}
  .accent-purple{color:#b79bff}
  .accent-green{color:#5ff0a3}

  .panel{background:var(--panel);border:1px solid var(--bd);border-radius:16px;padding:18px}
  .panel .ttl{font-weight:700;margin:0 0 4px}
  .panel .desc{color:var(--dim);font-size:12.5px;margin:0 0 14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:780px){.grid2{grid-template-columns:1fr}}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}
  th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--bd)}
  .bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;min-width:60px}
  .bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--purple),var(--blue))}
  .bar.g > i{background:linear-gradient(90deg,var(--green),#0fb6c6)}

  /* gate */
  .gate{max-width:380px;margin:12vh auto 0;text-align:center}
  .gate .box{background:var(--panel);border:1px solid var(--bd);border-radius:18px;padding:26px 22px}
  .gate input{width:100%;margin-top:14px;background:var(--bg);border:1px solid var(--bd2);color:var(--tx);
    padding:12px 14px;border-radius:12px;font-size:15px;text-align:center;letter-spacing:.04em}
  .gate button{width:100%;margin-top:12px;background:var(--purple);color:#fff;border:0;padding:12px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
  .gate .err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
  .muted{color:var(--mut)}
  .hidden{display:none!important}
  .spark{width:100%;height:150px;display:block}
  .legend{display:flex;gap:16px;font-size:12.5px;color:var(--mut);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .loading{color:var(--dim);padding:40px 0;text-align:center}
</style>
</head>
<body>

<!-- ============ GATE (token) ============ -->
<div id="gate" class="gate">
  <div class="box">
    <div class="brand" style="justify-content:center"><span class="dot"></span> Painel Doppa</div>
    <p class="muted" style="font-size:13.5px;margin-top:12px">Digite a chave de acesso para ver as métricas.</p>
    <input id="token" type="password" placeholder="chave de acesso" autocomplete="off" />
    <button id="enter">Entrar</button>
    <div id="gateErr" class="err"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <div class="wrap">
      <div class="brand"><span class="dot"></span> Painel Doppa</div>
      <div class="grow"></div>
      <div class="rangebtns" id="range">
        <button data-d="7">7d</button>
        <button data-d="30" class="on">30d</button>
        <button data-d="90">90d</button>
      </div>
      <button class="ghost" id="refresh">Atualizar</button>
      <button class="ghost" id="logout" title="Sair">Sair</button>
    </div>
  </header>

  <div class="wrap">
    <div id="body">
      <div class="loading">Carregando…</div>
    </div>
    <p class="updated" id="updated" style="margin-top:18px"></p>
  </div>
</div>

<script>
(function(){
  var FN = "https://ajwfpdprgdcvrkermcwx.supabase.co/functions/v1/painel";
  var LS = "doppa_painel_token";
  var state = { token: "", days: 30, data: null };

  var $ = function(s){ return document.querySelector(s); };
  var el = function(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };
  var nf = function(n){ return (n==null?0:n).toLocaleString("pt-BR"); };
  var pct = function(a,b){ if(!b) return "0%"; return Math.round(a/b*100) + "%"; };
  var pctNum = function(a,b){ if(!b) return 0; return a/b*100; };

  /* ---------- gate ---------- */
  function showGate(msg){ $("#app").classList.add("hidden"); $("#gate").classList.remove("hidden"); if(msg) $("#gateErr").textContent = msg; $("#token").focus(); }
  function enter(){
    var t = $("#token").value.trim();
    if(!t){ $("#gateErr").textContent="Digite a chave."; return; }
    state.token = t;
    try{ localStorage.setItem(LS, t); }catch(e){}
    $("#gate").classList.add("hidden"); $("#app").classList.remove("hidden");
    load();
  }
  $("#enter").addEventListener("click", enter);
  $("#token").addEventListener("keydown", function(e){ if(e.key==="Enter") enter(); });
  $("#logout").addEventListener("click", function(){ try{localStorage.removeItem(LS);}catch(e){} state.token=""; $("#token").value=""; showGate(""); });
  $("#refresh").addEventListener("click", function(){ load(); });
  $("#range").addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    state.days = parseInt(b.dataset.d,10);
    [].forEach.call(this.querySelectorAll("button"), function(x){ x.classList.toggle("on", x===b); });
    load();
  });

  /* ---------- fetch ---------- */
  function load(){
    $("#body").innerHTML = '<div class="loading">Carregando…</div>';
    var u = FN + "/data?token=" + encodeURIComponent(state.token) + "&days=" + state.days;
    fetch(u).then(function(r){
      if(r.status===401){ throw {code:401}; }
      if(!r.ok){ throw {code:r.status}; }
      return r.json();
    }).then(function(d){
      state.data = d; render(d);
      var now = new Date();
      $("#updated").textContent = "Atualizado às " + now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) + " · dados dos últimos " + state.days + " dias";
    }).catch(function(err){
      if(err && err.code===401){ showGate("Chave inválida."); return; }
      $("#body").innerHTML = '<div class="loading">Não consegui carregar os dados. Tente <b>Atualizar</b>.<br><span class="muted" style="font-size:12px">'+(err&&err.code?("erro "+err.code):"")+'</span></div>';
    });
  }

  /* ---------- render ---------- */
  function render(d){
    var t = d.totals || {};
    var body = el("div");

    /* KPIs */
    body.appendChild(el("h1", null, "Visão geral"));
    var cards = el("div","cards");
    cards.appendChild(kpi("Views do vídeo", nf(t.plays), "quem deu play", "p"));
    cards.appendChild(kpi("Assistiram até o fim", nf(t.completes), pct(t.completes,t.plays)+" dos plays", "g"));
    cards.appendChild(kpi("Cadastros (leads)", nf(t.leads), pct(t.leads,t.plays)+" dos plays viram lead", "p"));
    cards.appendChild(kpi("Viram a tela do WhatsApp", nf(t.wpp_view), "chegaram no fim do form", "y"));
    cards.appendChild(kpi("Clicaram no WhatsApp", nf(t.wpp_click), pct(t.wpp_click,t.wpp_view)+" dos que viram clicaram", "g"));
    body.appendChild(cards);

    /* Daily chart */
    body.appendChild(el("h1", null, "Por dia"));
    var pDaily = el("div","panel");
    pDaily.appendChild(el("div","ttl","Plays e cadastros ao longo do tempo"));
    pDaily.appendChild(el("div","desc","Barras roxas = plays no vídeo · linha verde = cadastros."));
    pDaily.appendChild(sparkChart(d.daily||[]));
    var lg = el("div","legend"); lg.innerHTML = '<span><i style="background:#7B4DFF"></i>Plays</span><span><i style="background:#22D46E"></i>Cadastros</span>';
    pDaily.appendChild(lg);
    body.appendChild(pDaily);

    /* two columns: retenção + funil whatsapp */
    body.appendChild(el("h1", null, "Vídeo e WhatsApp"));
    var g2 = el("div","grid2");

    /* retenção */
    var ret = d.retention || {}; var curve = ret.curve || []; var base = ret.base||0;
    var pRet = el("div","panel");
    pRet.appendChild(el("div","ttl","Retenção do vídeo"));
    pRet.appendChild(el("div","desc", base ? ("De "+nf(base)+" espectadores medidos · saída média perto de "+ (ret.avg_exit_pct!=null?ret.avg_exit_pct+"%":"—")) : "Ainda sem dados de retenção suficientes."));
    curve.forEach(function(c){
      var row = el("div"); row.style.cssText="display:flex;align-items:center;gap:10px;margin:8px 0";
      row.appendChild(elTxt("span","Chegou a "+c.pct+"%","width:96px;color:var(--mut);font-size:13px"));
      var bar = el("div","bar g"); bar.style.flex="1"; var i=el("i"); i.style.width=pctNum(c.reached,base)+"%"; bar.appendChild(i); row.appendChild(bar);
      row.appendChild(elTxt("span", nf(c.reached)+" ("+pct(c.reached,base)+")","width:96px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums"));
      pRet.appendChild(row);
    });
    g2.appendChild(pRet);

    /* funil whatsapp por app */
    var apps = d.wpp_by_app || [];
    var pApp = el("div","panel");
    pApp.appendChild(el("div","ttl","WhatsApp por origem de navegador"));
    pApp.appendChild(el("div","desc","Onde a tela de sucesso é vista e quanto se converte em clique. Taxa baixa em app embutido = handoff falhando (tela branca)."));
    if(!apps.length){
      pApp.appendChild(el("div","muted","Ainda sem cliques/telas de WhatsApp registrados neste período."));
    } else {
      var tb = el("table"); tb.innerHTML = "<thead><tr><th>Navegador</th><th>Ambiente</th><th class='num'>Viram</th><th class='num'>Clicaram</th><th class='num'>%</th></tr></thead>";
      var tbody = el("tbody");
      apps.forEach(function(a){
        var rate = pctNum(a.clicks,a.views);
        var cls = a.in_app ? (rate<40?"r":"y") : "g";
        var tr = el("tr");
        tr.innerHTML = "<td><span class='tag'>"+esc(a.app)+"</span></td>"+
          "<td>"+(a.in_app?"<span class='pill r'>App embutido</span>":"<span class='pill g'>Navegador</span>")+"</td>"+
          "<td class='num'>"+nf(a.views)+"</td>"+
          "<td class='num'>"+nf(a.clicks)+"</td>"+
          "<td class='num'><span class='pill "+cls+"'>"+pct(a.clicks,a.views)+"</span></td>";
        tbody.appendChild(tr);
      });
      tb.appendChild(tbody); pApp.appendChild(tb);
    }
    g2.appendChild(pApp);
    body.appendChild(g2);

    /* por origem (btag) */
    body.appendChild(el("h1", null, "Por origem (link/campanha)"));
    var pBt = el("div","panel");
    pBt.appendChild(el("div","ttl","Desempenho por origem"));
    pBt.appendChild(el("div","desc","Cada link de tráfego pago, streamer ou afiliado aparece aqui pela sua etiqueta."));
    var bt = d.by_btag || [];
    if(!bt.length){ pBt.appendChild(el("div","muted","Sem dados no período.")); }
    else {
      var maxLeads = Math.max.apply(null, bt.map(function(x){return x.leads||0;}).concat([1]));
      var tb2 = el("table"); tb2.innerHTML = "<thead><tr><th>Origem</th><th class='num'>Plays</th><th class='num'>Cadastros</th><th style='width:130px'></th></tr></thead>";
      var tbody2 = el("tbody");
      bt.forEach(function(x){
        var tr = el("tr");
        var barW = Math.round(pctNum(x.leads,maxLeads));
        tr.innerHTML = "<td><span class='tag'>"+esc(x.btag)+"</span></td>"+
          "<td class='num'>"+nf(x.plays)+"</td>"+
          "<td class='num'>"+nf(x.leads)+"</td>"+
          "<td><div class='bar'><i style='width:"+barW+"%'></i></div></td>";
        tbody2.appendChild(tr);
      });
      tb2.appendChild(tbody2); pBt.appendChild(tb2);
    }
    body.appendChild(pBt);

    $("#body").innerHTML = "";
    $("#body").appendChild(body);
  }

  function kpi(lab, val, sub, color){
    var c = el("div","card");
    c.appendChild(el("div","lab", lab));
    var v = el("div","val", val); v.classList.add(color==="g"?"accent-green":(color==="p"?"accent-purple":""));
    c.appendChild(v);
    c.appendChild(el("div","sub", sub));
    return c;
  }
  function elTxt(tag, txt, css){ var e=el(tag,null,esc(txt)); if(css)e.style.cssText=css; return e; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m];}); }

  /* SVG: plays (barras) + leads (linha) */
  function sparkChart(daily){
    var W=1000, H=150, pad=6;
    if(!daily.length){ var e=el("div","muted","Sem dados no período."); return e; }
    var maxP = Math.max.apply(null, daily.map(function(d){return d.plays||0;}).concat([1]));
    var maxL = Math.max.apply(null, daily.map(function(d){return d.leads||0;}).concat([1]));
    var n = daily.length;
    var bw = (W - pad*2) / n;
    var svg = '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Plays e cadastros por dia">';
    // bars (plays)
    daily.forEach(function(d,i){
      var h = (H-24) * ((d.plays||0)/maxP);
      var x = pad + i*bw + bw*0.16;
      var w = bw*0.68;
      svg += '<rect x="'+x.toFixed(1)+'" y="'+(H-16-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(h,0).toFixed(1)+'" rx="2" fill="#7B4DFF" opacity="0.85"></rect>';
    });
    // line (leads)
    var pts = daily.map(function(d,i){
      var x = pad + i*bw + bw/2;
      var y = (H-16) - (H-24) * ((d.leads||0)/maxL);
      return x.toFixed(1)+","+y.toFixed(1);
    }).join(" ");
    svg += '<polyline points="'+pts+'" fill="none" stroke="#22D46E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>';
    svg += '</svg>';
    var wrap = el("div"); wrap.innerHTML = svg;
    return wrap;
  }

  /* ---------- boot ---------- */
  try{ state.token = localStorage.getItem(LS) || ""; }catch(e){}
  if(state.token){ $("#gate").classList.add("hidden"); $("#app").classList.remove("hidden"); load(); }
  else { showGate(""); }
})();
</script>
</body>
</html>
