<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Doppa</title>
  <style>
    html,body{height:100%;margin:0;background:#0c0520;color:#c3c8e6;
      font-family:'Segoe UI',Arial,sans-serif;display:flex;align-items:center;justify-content:center}
  </style>
  <script>
    /* Redirecionador de afiliado — guarda a btag e limpa a URL.
       A VSL agora é a HOME (/). A LP antiga vive em /lp.
       Uso:  /go?b=CODIGO           -> vai pra home (VSL)
             /go?b=CODIGO&to=lp     -> vai pra LP secundária
       (to=vsl continua válido e cai na home). Aceita ?b= ou ?btag=. */
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var raw = p.get("b") || p.get("btag") || "";
        var btag = raw.trim().replace(/[^\w.\-]/g, "").slice(0, 64).toLowerCase();
        if (btag) localStorage.setItem("doppa_btag", btag);
        var to = (p.get("to") || "").toLowerCase();
        var dest = to === "lp" ? "/lp" : "/";
        location.replace(dest);
      } catch (e) {
        location.replace("/");
      }
    })();
  </script>
</head>
<body>Redirecionando…</body>
</html>
